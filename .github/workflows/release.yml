name: release

# 打 v 开头的 tag 触发：先跑一遍门禁，再为各平台产出安装包挂到 Release。
# 安装包内容 = fan-cli 可执行文件 + 标准库（sdk/ 目录）。

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 上传安装包到 Release

env:
  CARGO_TERM_COLOR: always
  # 标准库位置：门禁里的标准库测试读它
  FAN_SDK: ${{ github.workspace }}/fan-sdk

jobs:
  gate:
    name: 门禁
    # 与 ci 相同的四道门禁，避免给跑不通的版本打 Release
    runs-on: ubuntu-latest
    steps:
      - name: 取出 fan-rust
        uses: actions/checkout@v4

      - name: 取出标准库
        uses: actions/checkout@v4
        with:
          repository: china-lang-fan/fan-sdk
          path: fan-sdk

      # 版本号只认 Cargo.toml（fan-cli 版本 读的就是它），tag 必须与之相同，
      # 以免出现「包叫 0.2.0、fan 版本 却报 0.1.0」
      - name: 校验 tag 与 Cargo.toml 版本一致
        run: |
          set -euo pipefail
          # shell 变量只能用 ASCII：bash 不认中文变量名，
          # 写「清单版本=...」会被当成命令执行而不是赋值
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(awk -F'"' '/^version = "/ {print $2; exit}' Cargo.toml)
          echo "tag 版本：$tag_version"
          echo "Cargo.toml 版本：$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag 版本 $tag_version 与 Cargo.toml 版本 $cargo_version 不一致"
            echo "请先改 Cargo.toml 的 version 并提交，再打同版本的 tag"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 代码格式检查（cargo fmt）
        run: cargo fmt --all -- --check

      - name: 静态检查（clippy）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试（cargo test）
        run: cargo test --workspace

      - name: 标准库测试（fan 测试）
        run: |
          cargo build -p fan-cli
          ./target/debug/fan-cli 测试 "$FAN_SDK"

  build:
    name: 构建安装包
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          # 用新的 Intel 标签：macos-13 机型正退役，排队常等数十分钟
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: 取出 fan-rust
        uses: actions/checkout@v4

      # 标准库随安装包分发，取默认分支的最新版本
      - name: 取出标准库
        uses: actions/checkout@v4
        with:
          repository: china-lang-fan/fan-sdk
          path: fan-sdk

      # 必须指定 bash：Windows 默认用 pwsh，它不认 ${VAR#v} 这类参数展开，
      # 结果 FAN_VERSION 没被设上，而组装步骤开了 set -u，未定义变量即报错
      - name: 计算版本号
        shell: bash
        run: echo "FAN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建 release
        run: cargo build --release --target ${{ matrix.target }} -p fan-cli

      # 标准库只带 .凡 与说明文件，不带 .git
      - name: 组装安装包
        shell: bash
        run: |
          set -euo pipefail
          # 打印出来，万一再出错能一眼看出版本号有没有取到
          echo "FAN_VERSION=[$FAN_VERSION]"
          pkg="fan-$FAN_VERSION-${{ matrix.target }}"
          mkdir -p "$pkg/sdk"
          if [ -f "target/${{ matrix.target }}/release/fan-cli.exe" ]; then
            cp "target/${{ matrix.target }}/release/fan-cli.exe" "$pkg/"
          else
            cp "target/${{ matrix.target }}/release/fan-cli" "$pkg/"
          fi
          cp fan-sdk/*.凡 "$pkg/sdk/"
          cp fan-sdk/README.md fan-sdk/LICENSE "$pkg/sdk/"

      - name: 打包（tar.gz）
        if: runner.os != 'Windows'
        run: tar -czf "fan-$FAN_VERSION-${{ matrix.target }}.tar.gz" "fan-$FAN_VERSION-${{ matrix.target }}"

      - name: 打包（zip）
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "fan-$env:FAN_VERSION-${{ matrix.target }}" -DestinationPath "fan-$env:FAN_VERSION-${{ matrix.target }}.zip"

      - name: 上传安装包
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: fan-${{ env.FAN_VERSION }}-${{ matrix.target }}.tar.gz
          # 同一版本重跑时要能覆盖同名产物
          overwrite: true
          generate_release_notes: true

      - name: 上传安装包
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: fan-${{ env.FAN_VERSION }}-${{ matrix.target }}.zip
          overwrite: true
          generate_release_notes: true
