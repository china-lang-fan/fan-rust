[package]
name = "fan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "凡语言命令行工具"

# crate 包名仍为 fan-cli（被 workspace 与各 crate 依赖），
# 但对外分发的可执行文件命名为语言命令 `fan`（Windows 下为 fan.exe）。
[[bin]]
name = "fan"
path = "src/main.rs"

[dependencies]
fan-ast = { workspace = true }
fan-eval = { workspace = true }
fan-lexer = { workspace = true }
fan-object = { workspace = true }
fan-parser = { workspace = true }
fan-testrun = { workspace = true }
fan-native = { workspace = true }
fan-analysis = { workspace = true }
fan-lsp = { workspace = true }
