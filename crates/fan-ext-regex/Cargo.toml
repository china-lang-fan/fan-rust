[package]
name = "fan-ext-regex"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "凡语言正则扩展库：基于 regex crate，以动态库形式按需加载"

[lib]
name = "fan_ext_regex"
# cdylib：供解释器 dlopen；rlib：便于测试与复用
crate-type = ["cdylib", "rlib"]

[dependencies]
fan-object = { path = "../fan-object" }
regex = "1"
