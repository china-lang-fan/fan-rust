[package]
name = "fan-native"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "凡语言原生函数库"

# core 组只依赖标准库；ext 组（正则/JSON/HTTP）依赖成熟第三方 crate，
# 全部随解释器静态编入，启动时统一注册，无动态库与 FFI 边界，见 `src/ext/`。
[dependencies]
fan-ast = { workspace = true }
fan-object = { workspace = true }
regex = "1"
# preserve_order：保持对象键的写入顺序，与凡语言字典语义一致
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3"
