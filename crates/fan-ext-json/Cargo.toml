[package]
name = "fan-ext-json"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "凡语言 JSON 扩展库：基于 serde_json，以动态库形式按需加载"

[lib]
name = "fan_ext_json"
# cdylib：供解释器 dlopen；rlib：便于测试与复用
crate-type = ["cdylib", "rlib"]

[dependencies]
# format_f64：浮点序列化要与内置回落实现逐字一致
fan-ast = { path = "../fan-ast" }
fan-object = { path = "../fan-object" }
# preserve_order：保持对象键的写入顺序，与内置回落实现的行为一致
serde_json = { version = "1", features = ["preserve_order"] }
