[package]
name = "fan-ext-tag"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "凡语言标签扩展库：提供 注册标签处理 的动态库实现，按需加载"

[lib]
name = "fan_ext_tag"
# cdylib：供解释器 dlopen；rlib：便于测试与复用
crate-type = ["cdylib", "rlib"]

[dependencies]
fan-object = { path = "../fan-object" }

[dev-dependencies]
fan-ast = { path = "../fan-ast" }
